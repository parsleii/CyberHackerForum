{% extends "base.html" %}
{% block content %}
<h2>Dodaj wpis</h2>
<form method="post">
  <textarea name="content" rows="3" required></textarea>
  <button type="submit">Wyślij</button>
</form>

<h2>Wpisy</h2>
{% for post in posts %}
  <div class="post">
    <div class="meta">{{ post.author.username }} — {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}</div>
    <div>{{ post.content }}</div>
  </div>
{% else %}
  <p>Brak wpisów. Bądź pierwszy!</p>
{% endfor %}
{% endblock %}
