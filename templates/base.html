<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>CyberHackerForum</title>
  
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <marquee><h1>CyberHackerForum</h1></marquee>
  {% if me %}
    <p>Zalogowany jako <a href="{{ url_for('profile', user_id=me.id) }}"><b>{{ me.username }}</b></a>{% if me.is_admin %} (admin){% endif %}
      | <a href="{{ url_for('forum') }}">Forum</a>
      | <a href="{{ url_for('users') }}">Użytkownicy</a>
      | <a href="{{ url_for('logout') }}">Wyloguj</a></p>
  {% endif %}

  {% for msg in get_flashed_messages() %}
    <div class="flash">{{ msg }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</body>
</html>
