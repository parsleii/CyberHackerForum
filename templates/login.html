{% extends "base.html" %}
{% block content %}
<h2>Logowanie</h2>
<form method="post">
  <label>Login</label>
  <input name="username" required autocomplete="username">
  <label>Hasło</label>
  <input name="password" type="password" required autocomplete="current-password">
  <button type="submit">Zaloguj</button>
</form>
<p><a href="{{ url_for('forgot_password') }}">Nie pamiętasz hasła?</a></p>
{% if show_resend %}
<p><a href="{{ url_for('resend_verification') }}">Wyślij ponownie link aktywacyjny</a></p>
{% endif %}
<p>Nie masz konta? <a href="{{ url_for('register') }}">Zarejestruj się</a></p>
{% endblock %}
